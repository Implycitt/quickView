<main
    id="main-content"
    class="relative flex min-w-0 flex-1 justify-center overflow-y-auto bg-gray-900 transition-colors duration-300 [&::-webkit-scrollbar]:hidden [-ms-overflow-style:none] scrollbar-none"
>
    <div class="empty-state" id="empty-state">
        <svg
            xmlns="http://www.w3.org/2000/svg"
            class="empty-state-icon"
            fill="none"
            viewBox="0 0 48 48"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
        >
            <path d="M15 7h14l7 7v25a2 2 0 0 1-2 2H15a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Z" />
            <path d="M29 7v5a2 2 0 0 0 2 2h5" />
            <path d="M20 23h10M20 29h10M20 35h7" />
        </svg>
        <div class="empty-state-copy">
            <h2>No document selected</h2>
            <p>Open a Markdown, PDF, or HTML file to view it.</p>
            <button type="button" class="file-picker-btn empty-state-action">Open a document</button>
        </div>
    </div>
</main>
