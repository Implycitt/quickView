<div id="titlebar">
    <div class="titlebar-drag">
        <img class="titlebar-icon" src="../../assets/icons/icon.png" alt="" draggable="false" />
        <span id="titlebar-document" class="titlebar-title">QuickView</span>
    </div>
    <div class="titlebar-controls">
        <button id="window-minimize" type="button" class="titlebar-btn" title="Minimize" aria-label="Minimize">
            <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 10 10"
                shape-rendering="crispEdges"
                fill="none"
                stroke="currentColor"
                stroke-width="1"
            >
                <path d="M0 5.5h10" />
            </svg>
        </button>
        <button id="window-maximize" type="button" class="titlebar-btn" title="Maximize" aria-label="Maximize">
            <svg
                class="titlebar-icon-maximize"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 10 10"
                shape-rendering="crispEdges"
                fill="none"
                stroke="currentColor"
                stroke-width="1"
            >
                <rect x="0.5" y="0.5" width="9" height="9" />
            </svg>
            <svg
                class="titlebar-icon-restore"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 10 10"
                shape-rendering="crispEdges"
                fill="none"
                stroke="currentColor"
                stroke-width="1"
            >
                <path d="M2.5 0.5h7v7" />
                <rect x="0.5" y="2.5" width="7" height="7" />
            </svg>
        </button>
        <button id="window-close" type="button" class="titlebar-btn" title="Close" aria-label="Close">
            <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 10 10"
                shape-rendering="crispEdges"
                fill="none"
                stroke="currentColor"
                stroke-width="1"
            >
                <path d="M0.5 0.5l9 9M9.5 0.5l-9 9" />
            </svg>
        </button>
    </div>
</div>
