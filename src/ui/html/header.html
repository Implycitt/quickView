<header
    class="app-header relative z-10 flex flex-wrap items-center justify-between gap-x-4 gap-y-2 border-b border-gray-700/80 bg-gray-800 px-4 py-2.5"
>
    <div class="flex min-w-0 items-center gap-3">
        <div class="flex shrink-0 items-center gap-1">
            <button
                id="sidebar-toggle"
                type="button"
                title="Toggle sidebar"
                aria-label="Toggle sidebar"
                class="flex h-9 w-9 cursor-pointer items-center justify-center rounded-md text-gray-400 transition-colors hover:bg-gray-700 hover:text-lavender-400 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-lavender-400"
            >
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    class="h-5 w-5"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                    stroke-width="2"
                    aria-hidden="true"
                >
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>
            <button
                id="keybinds-toggle"
                type="button"
                title="Keyboard shortcuts (/)"
                aria-label="Keyboard shortcuts"
                class="flex h-9 w-9 cursor-pointer items-center justify-center rounded-md text-gray-400 transition-colors hover:bg-gray-700 hover:text-lavender-400 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-lavender-400"
            >
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    class="h-5 w-5"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                    stroke-width="1.75"
                    aria-hidden="true"
                >
                    <rect x="4" y="4" width="16" height="16" rx="3" />
                    <path stroke-linecap="round" d="m14 8-4 8" />
                </svg>
            </button>
        </div>
        <h1 class="shrink-0 text-base font-semibold tracking-tight text-gray-100">QuickView</h1>
        <span
            id="breadcrumb"
            class="hidden min-w-0 max-w-[360px] truncate border-l border-gray-700 pl-3 text-xs font-medium text-gray-400"
            title=""
        ></span>
    </div>
    <div class="header-actions flex min-w-0 flex-wrap items-center justify-end gap-2">
        <div id="pdf-tools" class="hidden flex items-center gap-2.5 border-r border-gray-700 pr-3">
            <button
                id="toggle-scroll-mode"
                type="button"
                title="Toggle scroll mode (M)"
                class="cursor-pointer rounded-md border border-gray-700 bg-gray-700/70 px-2.5 py-1.5 text-xs font-medium text-gray-200 transition-colors hover:bg-gray-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-lavender-400"
            >
                Mode: Free
            </button>
            <div class="flex h-8 items-center overflow-hidden rounded-md border border-gray-700 bg-gray-900">
                <button
                    id="zoom-out"
                    type="button"
                    title="Zoom out"
                    class="cursor-pointer p-1.5 text-gray-400 transition-colors hover:bg-gray-800 hover:text-lavender-400 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-lavender-400"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                        <path
                            fill-rule="evenodd"
                            d="M3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z"
                            clip-rule="evenodd"
                        />
                    </svg>
                </button>
                <input
                    type="text"
                    id="zoom-level"
                    aria-label="Zoom level"
                    class="w-10 bg-transparent px-0 text-center font-mono text-xs font-medium text-gray-300 outline-none transition-colors focus:text-lavender-400"
                    value="100%"
                />
                <button
                    id="zoom-in"
                    type="button"
                    title="Zoom in"
                    class="cursor-pointer p-1.5 text-gray-400 transition-colors hover:bg-gray-800 hover:text-lavender-400 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-lavender-400"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                        <path
                            fill-rule="evenodd"
                            d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z"
                            clip-rule="evenodd"
                        />
                    </svg>
                </button>
            </div>
            <div class="flex h-8 items-center overflow-hidden rounded-md border border-gray-700 bg-gray-900">
                <span class="pl-2 pr-1 text-[10px] font-medium text-gray-500">Page</span>
                <input
                    type="text"
                    id="page-counter"
                    inputmode="numeric"
                    title="Jump to page (Enter to go, G to focus)"
                    aria-label="Page number"
                    class="w-9 bg-transparent text-center font-mono text-xs font-medium text-gray-300 outline-none transition-colors focus:text-lavender-400"
                    value="1"
                />
                <span id="page-total" class="pr-2 text-xs font-mono text-gray-500">/ 1</span>
            </div>
        </div>
        <button
            type="button"
            id="choose-file-button"
            class="file-picker-btn cursor-pointer rounded-md bg-lavender-600 px-3.5 py-1.5 text-sm font-medium transition-colors hover:bg-lavender-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-lavender-400"
        >
            Choose file
        </button>
    </div>
</header>
