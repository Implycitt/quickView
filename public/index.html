<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com blob:; style-src 'self' 'unsafe-inline'; frame-src blob:;">
    <title>QuickView</title>
    <link rel="stylesheet" href="main.css">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans h-screen overflow-hidden flex flex-col selection:bg-lavender-500 selection:text-white">

    <header class="bg-gray-800 border-b border-gray-700 px-4 py-3 flex justify-between items-center shadow-md z-10">
        <div class="flex items-center gap-3">
            <button id="sidebar-toggle" class="p-2 text-gray-400 hover:bg-gray-700 hover:text-lavender-400 rounded-lg transition-colors cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>
            <h1 class="text-xl font-bold text-gray-100 tracking-tight">QuickView</h1>
        </div>
        <button class="file-picker-btn bg-lavender-600 hover:bg-lavender-500 text-white font-medium py-2 px-4 rounded-lg transition-colors shadow-sm">
            Choose File
        </button>
    </header>

    <div class="flex flex-1 overflow-hidden relative">
        
        <aside id="sidebar" class="w-64 flex-shrink-0 bg-gray-800 border-r border-gray-700 transition-[width] duration-300 ease-in-out overflow-hidden flex flex-col shadow-inner">
            <div class="p-4 border-b border-gray-700 bg-gray-900/50">
                <h2 class="text-xs font-bold text-lavender-400 uppercase tracking-wider">Previews</h2>
            </div>
            <div id="sidebar-content" class="flex-1 overflow-y-auto p-4 space-y-4">
                <p class="text-sm text-gray-500 italic text-center mt-4">No file loaded.</p>
            </div>
        </aside>

        <main id="main-content" class="flex-1 overflow-y-auto flex justify-center transition-colors duration-300 bg-gray-900">
            <div class="w-full max-w-5xl p-8 my-auto text-center" id="empty-state">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mx-auto text-gray-600 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                <h2 class="text-2xl font-bold text-gray-400 mb-2">No Document Selected</h2>
                <p class="text-gray-500">Click the button at the top to load a Markdown or PDF file.</p>
            </div>
        </main>
    </div>

    <script type="module" src="../dist/renderer.js"></script>
</body>
</html>
