name: Build and Release QuickView

on:
  push:
    tags:
      - "v*"

jobs:
  build-electron:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "bun"

      - name: Install Dependencies
        run: bun install

      - name: Build Code
        run: bun run build

      - name: Compile and Package (Electron)
        run: bun run package

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
